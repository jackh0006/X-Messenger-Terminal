#!/usr/bin/env bash
# SPDX-License-Identifier: MIT
# X Messenger Terminal — CI Configuration
# Runs all tests in network-less namespace (unshare -rn)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup dependencies (amd64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age openssh-client qrencode zbar-tools bats shellcheck shfmt expect

      - name: Setup dependencies (arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age openssh-client qrencode zbar-tools bats shellcheck shfmt qemu-user-static expect

      - name: Install shfmt
        run: |
          curl -sSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: Install semgrep
        run: |
          pipx install semgrep

      - name: Verify xc script syntax
        run: |
          shellcheck -S style xc
          shfmt -d xc

      - name: Run tests
        run: |
          ./scripts/run-tests.sh

      - name: Upload audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-evidence-${{ matrix.os }}
          path: evidence/
          retention-days: 30

  audit:
    name: Full Audit
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age openssh-client qrencode zbar-tools bats shellcheck shfmt expect

      - name: Run full audit
        run: |
          ./scripts/audit.sh

      - name: Upload audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-report
          path: evidence/
          retention-days: 90

  